plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.geradorcurriculo'
    compileSdk 34

    defaultConfig {
        applicationId "br.com.cvpro.app"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    lintOptions {
        abortOnError false
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.navigation:navigation-fragment:2.7.6'
    implementation 'androidx.navigation:navigation-ui:2.7.6'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    
    // JSON parsing
    implementation 'com.google.code.gson:gson:2.9.0'
    
    // Room database
    implementation 'androidx.room:room-runtime:2.5.0'
    annotationProcessor 'androidx.room:room-compiler:2.5.0'
    
    // HTTP client for ATS analysis
    implementation 'com.squareup.okhttp3:okhttp:4.9.3'
    
    // PDF generation - iText
    implementation 'com.itextpdf:itext7-core:7.2.5'
    
    // PDF e DOCX parsing - comentados temporariamente para resolver compilação
    // implementation 'com.tom_roush:pdfbox-android:2.0.27.0'
    // implementation 'org.apache.poi:poi-ooxml:5.2.3'
    
    // Firebase (optional - comentado por enquanto)
    // implementation platform('com.google.firebase:firebase-bom:32.7.0')
    // implementation 'com.google.firebase:firebase-analytics'
    // implementation 'com.google.firebase:firebase-crashlytics'
    
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}